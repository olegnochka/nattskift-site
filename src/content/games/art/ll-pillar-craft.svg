<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0B0E12"/>
  <!-- a small grid: few slots, real choices -->
  <g fill="#16131F" stroke="#201B2E" stroke-width="2">
    <rect x="170" y="180" width="120" height="120" rx="10"/>
    <rect x="340" y="180" width="120" height="120" rx="10"/>
    <rect x="510" y="180" width="120" height="120" rx="10"/>
    <rect x="170" y="330" width="120" height="120" rx="10"/>
    <rect x="340" y="330" width="120" height="120" rx="10"/>
    <rect x="510" y="330" width="120" height="120" rx="10"/>
  </g>
  <!-- axe head + handle occupying one slot -->
  <rect x="392" y="210" width="16" height="70" rx="4" fill="#9AA4B2"/>
  <polygon points="380,214 420,214 428,240 372,240" fill="#ECEFF3"/>
  <!-- flint spark in another -->
  <polygon points="230,380 238,396 254,388 242,404 252,416 232,408 222,422 226,402 210,396 228,394" fill="#FFB74A"/>
  <!-- one slot deliberately empty with a plus -->
  <g stroke="#201B2E" stroke-width="6" stroke-linecap="round">
    <line x1="570" y1="370" x2="570" y2="410"/>
    <line x1="550" y1="390" x2="590" y2="390"/>
  </g>
</svg>
