# Netlify build settings — kept in the repo so the dashboard needs no manual
# configuration. Astro outputs static HTML to dist/; 404.html is picked up
# automatically as the not-found page.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Apple fetches this to let Trap Architect open its share links (universal links). It must be JSON.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
